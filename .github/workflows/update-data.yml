# WH40K Companion — Aggiornamento automatico dati
# Esegue lo scraper ogni settimana e committa data.json aggiornato
name: Weekly Data Update

on:
  schedule:
    # Ogni lunedì alle 03:00 UTC (le 05:00 in Italia)
    - cron: '0 3 * * 1'
  # Permette di lanciarlo manualmente dal tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: |
          python scraper_ga.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nessun cambiamento rilevato in data.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Cambiamenti rilevati in data.json"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: aggiornamento automatico dati Wahapedia ($(date -u '+%Y-%m-%d'))"
          git push

      - name: Summary
        run: |
          echo "### Aggiornamento dati completato" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Cambiamenti: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
